<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro da Rifa - Moto Yamaha 0km</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gradient bg-primary-subtle text-white d-flex align-items-center justify-content-center min-vh-100">
    <div class="position-fixed top-0 start-50 translate-middle-x mt-3 w-75 z-3 d-flex justify-content-center">
        <div id="toastCadastro" class="toast align-items-center text-bg-success border-0 w-100 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
            <div id="toastTexto" class="toast-body text-center fw-semibold">
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <div class="bg-dark bg-opacity-75 rounded p-4 shadow">
                    <h2 class="text-center mb-4">Cadastro da Rifa da Yamaha MT-07 0km</h2>
                    <form id="formCadastro">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="telefone" class="form-label">Telefone - WhatsApp</label>
                            <input type="tel" class="form-control" id="telefone" name="telefone" required>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="termos" required>
                            <label class="form-check-label" for="termos">
                                Eu aceito os <a href="#" class="text-warning text-decoration-underline">termos e condições</a> da rifa.
                            </label>
                        </div>
                        <button type="submit" class="btn btn-outline-info w-100">Participar do Sorteio</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6 text-center">
                <img src="images/MT-07.png" alt="Moto Yamaha 0km" class="img-fluid mb-3">
                <p class="fs-3 text-black fw-bold">Valor da Rifa: apenas <span class="text-success">R$1,00</span> por número!</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById("formCadastro");
        const toastTexto = document.getElementById("toastTexto");
        const toastElemento = document.getElementById("toastCadastro");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value;

            toastTexto.textContent = `✅ Seu cadastro foi registrado! Verifique o e-mail (${email}) para cobrança e receber seu número da rifa!`;

            const toast = new bootstrap.Toast(toastElemento);
            toast.show();

            form.reset();
        });
    </script>
</body>
</html>
